base_branch: master
max_attempts_per_issue: 5
max_plan_minutes: 480
github_repo: mertnesvat/soundScapeV3
verifier:
  strategy: cli
  commands:
    lint: "true"
    typecheck: "xcodebuild -project SoundScape/SoundScape.xcodeproj -scheme SoundScape -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -quiet build"
    test: "xcodebuild test -project SoundScape/SoundScape.xcodeproj -scheme SoundScape -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -quiet"
observability:
  lens: false
